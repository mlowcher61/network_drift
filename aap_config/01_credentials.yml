---
# Credential SHELL only — the admin enters real values via the AAP UI after
# deploy. Per standards, no secrets ever live in this repo.
- name: Create credential shells
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: cred_servicenow
      ansible.controller.credential:
        name: cred_servicenow
        credential_type: servicenow
        organization: "{{ aap_organization | default('Default') }}"
        inputs:
          SN_HOST: PLACEHOLDER
          SN_USERNAME: PLACEHOLDER
          SN_PASSWORD: PLACEHOLDER

    # The PAT is injected from the GITHUB_PAT environment variable at deploy
    # time — it is never stored in git. Identity defaults can be overridden the
    # same way. When GITHUB_PAT is unset the token field is OMITTED (left
    # unchanged), so re-running config-as-code never clobbers a real token.
    - name: cred_github
      ansible.controller.credential:
        name: cred_github
        credential_type: github_scm_write
        organization: "{{ aap_organization | default('Default') }}"
        inputs:
          GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_PAT') | default(omit, true) }}"
          GIT_AUTHOR_NAME: "{{ lookup('env', 'GIT_AUTHOR_NAME') | default('mlowcher', true) }}"
          GIT_AUTHOR_EMAIL: "{{ lookup('env', 'GIT_AUTHOR_EMAIL') | default('mlowcher@hotmail.com', true) }}"
